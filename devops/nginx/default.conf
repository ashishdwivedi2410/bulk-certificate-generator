# Reverse proxy: public port 80 -> the app container on localhost:8000.
# For a domain + HTTPS: replace "server_name _;" with your domain, then run
#   sudo apt-get install -y certbot python3-certbot-nginx && sudo certbot --nginx -d your-domain
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;       # a 5000-recipient request is well under 1 MB

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;    # large ZIP downloads
    }
}